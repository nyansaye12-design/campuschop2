<style>
/* Layout: one narrow phone-first column. Sticky header, content, fixed dock (cart bar + tabs). */
:root{
  --bg:#f1f4ee; --surface:#ffffff; --ink:#15211a; --muted:#5a6a60; --line:#d8dfd3;
  --accent:#1b6a43; --accent-ink:#ffffff; --gold:#e6a21a; --gold-ink:#352600; --sky:#2a6db0; --danger:#b42318;
  --font-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1511; --surface:#17211b; --ink:#e8efe9; --muted:#9db0a3; --line:#28362d;
    --accent:#4cc38a; --accent-ink:#06210f; --gold:#f0b83a; --gold-ink:#2b1f00; --sky:#6cb3ff; --danger:#ff8a7a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1511; --surface:#17211b; --ink:#e8efe9; --muted:#9db0a3; --line:#28362d;
  --accent:#4cc38a; --accent-ink:#06210f; --gold:#f0b83a; --gold-ink:#2b1f00; --sky:#6cb3ff; --danger:#ff8a7a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{

  padding-block:0 170px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:560px;margin:0 auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.topin{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:12px;min-height:64px}
.ttl{min-width:0;flex:1}
.ttl h1{font-family:var(--font-display);font-weight:800;font-size:1.35rem;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.ttl p{color:var(--muted);font-size:.82rem;margin-top:2px}
.icon-btn{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.mark{flex:none;width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:1.2rem}

main{max-width:560px;margin:0 auto;padding-top:16px;display:flex;flex-direction:column;gap:16px}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.list{display:flex;flex-direction:column;gap:10px}

.rowmain{all:unset;box-sizing:border-box;flex:1;min-width:0;display:flex;align-items:center;gap:12px;cursor:pointer;border-radius:10px}
.rowmain:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tile{flex:none;width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:1.5rem;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--c)}
.tile.big{width:min(100%,340px);height:auto;aspect-ratio:1;border-radius:18px;margin-inline:auto}
.c-Mains{--c:var(--accent)} .c-Snacks{--c:var(--gold)} .c-Drinks{--c:var(--sky)}
.c-Snacks.tile{color:color-mix(in srgb,var(--gold) 70%,var(--ink))}
.rinfo{min-width:0;flex:1}

.price{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem;margin-top:2px;display:block}
.add{flex:none;height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:700}

.step button{width:36px;height:36px;border:0;background:transparent;color:var(--accent);font-size:1.2rem;font-weight:700}
.step output{min-width:24px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:0 18px;border-radius:14px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1rem}
.btn.ghost{background:transparent;color:var(--accent)}
.btn[disabled],.mini[disabled]{opacity:.4;cursor:not-allowed}
.mini{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:.85rem}

.panel h2{font-family:var(--font-display);font-size:1.05rem;font-weight:800;margin-bottom:8px}
.muted{color:var(--muted)}

.kv.total{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700;font-size:1.05rem}
.cartline{display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.cartline:last-child{border-bottom:0}
.undobar{display:flex;gap:8px;flex-wrap:wrap}
.undobar .mini{flex:1;min-width:140px;justify-content:center}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.legend{font-weight:700;font-size:.85rem}
input[type=text],input[type=tel]{width:100%;min-height:46px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.opt{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer}

.opt span{flex:1}
.err{color:var(--danger);font-weight:500;font-size:.88rem}

.order .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.order .head b{font-family:var(--font-mono);font-size:.95rem}
.tag{display:inline-block;font-family:var(--font-mono);font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--gold);color:var(--gold-ink)}
.tag.plain{background:var(--line);color:var(--muted)}
.big-num{font-family:var(--font-mono);font-weight:600;font-size:2.4rem;letter-spacing:.02em}
.done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:12px}

/* stack towers */
.tower{display:flex;flex-direction:column;gap:4px;font-family:var(--font-mono);font-size:.78rem}
.cell{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.cell i{font-style:normal;color:var(--muted);min-width:1.4em}
.cell.top-cell{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.cell .t{margin-left:auto;color:var(--accent);font-weight:600;letter-spacing:.05em}
.cell.empty{color:var(--muted);border-style:dashed}
.base{height:4px;border-radius:2px;background:var(--ink);opacity:.8}
.towers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.towers>.panel{min-width:0}
.uses{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.uses li{padding-left:14px;position:relative}
.uses li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:9;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:18px max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.dockin{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.cartbar{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:54px;padding:0 18px;border-radius:14px;border:0;background:var(--ink);color:var(--bg);font-weight:700}
.cartbar small{font-weight:500;opacity:.8;font-size:.82rem}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tab{border:0;background:transparent;border-radius:10px;min-height:42px;font-weight:500;font-size:.8rem}
.tab[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:700}

/* dish art */
.tile{overflow:hidden}
.tile svg{width:100%;height:100%;display:block}
.rowmain .tile{width:72px;height:72px;border-radius:14px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.strip .tile{width:100%;height:auto;aspect-ratio:1}
/* cover */
html[data-size="large"]{font-size:112.5%}
.cover{display:flex;flex-direction:column;gap:18px;padding-top:max(8px,3vh)}
.cover h1{font-family:var(--font-display);font-weight:800;font-size:clamp(3.4rem,19vw,5.6rem);line-height:.88;letter-spacing:-.03em}
.cover h1 span{color:var(--accent)}
.lede{font-size:1.1rem;max-width:34ch;color:var(--muted)}
.plates{width:min(240px,70%);height:auto;align-self:flex-start}
.plate-cap{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.facts div{border-top:2px solid var(--ink);padding-top:8px;min-width:0}
.facts b{display:block;font-family:var(--font-display);font-size:1.4rem;font-weight:800;line-height:1.1}
.facts span{color:var(--muted);font-size:.8rem}
/* settings */
.setgroup{display:flex;flex-direction:column;gap:14px}
.setgroup h2{margin:0}
.warnrow{display:flex;gap:8px;flex-wrap:wrap}
.mini.danger{color:var(--danger);border-color:var(--danger)}

#toast.on{display:flex}
#toast button{border:0;background:transparent;color:var(--gold);font-weight:700;padding:6px}
@media (prefers-reduced-motion:no-preference){
  main>*{animation:rise .22s ease-out both}
  @keyframes rise{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
}

function applySettings(){
  const r = document.documentElement;
  if (settings.theme === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', settings.theme);
  r.setAttribute('data-size', settings.size);

/* ---------- Helpers ---------- */
const money = n => 'GH₵ ' + n.toFixed(2);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const snap = () => JSON.parse(JSON.stringify(cart));
const count = () => Object.values(cart).reduce((a,b) => a + b, 0);
const subtotal = () => Object.entries(cart).reduce((s,[id,q]) => s + byId[id].price * q, 0);
const fee = () => MODES[form.mode].fee;

function loadOrders(){
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('campus-chop-orders') || 'null'); } catch(e) {}
  const list = saved ? saved : [
    {id:'CC-101',example:true,time:'Mon 12:41',where:MODES.counter.label,pay:'MoMo',name:'Example',total:41,items:[{id:'waakye',qty:1},{id:'sobolo',qty:1},{id:'bofrot',qty:1}]},

  ];
  list.forEach(o => orders.push(o));
}
function saveOrders(){
  try { localStorage.setItem('campus-chop-orders', JSON.stringify(orders.toArray())); } catch(e) {}
}

/* ---------- Cart actions: every change pushes a snapshot on the undo stack ---------- */
function mutate(label, fn){
  undo.push({label, cart:snap()});
  redo.clear();                      // a new action ends the "redo" future
  fn();
}
function doUndo(){
  const c = undo.pop();
  if (!c) return;
  redo.push({label:c.label, cart:snap()});
  cart = c.cart;
  notify('Undid: ' + c.label);
}
function doRedo(){
  const c = redo.pop();
  if (!c) return;
  undo.push({label:c.label, cart:snap()});
  cart = c.cart;
  notify('Redid: ' + c.label);
}
function addItem(id, n){
  mutate('Added ' + (n > 1 ? n + ' × ' : '') + byId[id].name, () => { cart[id] = (cart[id] || 0) + n; });
}
function removeOne(id){
  mutate('Removed one ' + byId[id].name, () => { cart[id] -= 1; if (cart[id] <= 0) delete cart[id]; });
}
function removeLine(id){
  mutate('Removed ' + byId[id].name, () => { delete cart[id]; });
}
function clearCart(){
  mutate('Cleared the cart', () => { cart = {}; });
}

/* ---------- Navigation stack ---------- */
function go(v){ nav.push(v); window.scrollTo(0,0); }
function back(){ if (nav.size > 1) { nav.pop(); window.scrollTo(0,0); } }
function tab(v){ nav.clear(); nav.push(v); window.scrollTo(0,0); }

/* ---------- Toast ---------- */
let toastTimer = null;
function notify(msg, withUndo){
  $toast.innerHTML = '<span>' + esc(msg) + '</span>' + (withUndo ? '<button data-act="undo">Undo</button>' : '');
  $toast.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $toast.classList.remove('on'), 4000);
}

/* ---------- Views ---------- */
const chevron = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';

function viewName(v){
  if (v.startsWith('item:')) return byId[v.slice(5)].name;
  return {menu:'Menu',cart:'Cart',checkout:'Checkout',done:'Order placed',orders:'Past orders',stacks:'Under the hood',cover:'Welcome',settings:'Settings'}[v];
}

function header(v){
  if (v === 'cover') return '';
  const root = nav.size === 1;
  let title = 'Campus Chop', sub = 'Main canteen · ready in about 15 min';
  if (v === 'orders'){ title = 'Past orders'; sub = 'Newest first'; }
  else if (v === 'stacks'){ title = 'Under the hood'; sub = 'The stacks running this app, live'; }
  else if (v !== 'menu'){ title = viewName(v); sub = ''; }
  const lead = root
    ? '<div class="mark" aria-hidden="true">C</div>'
    : '<button class="icon-btn" data-act="back" aria-label="Back to ' + esc(viewName(nav.toArray()[nav.size - 2])) + '">' + chevron + '</button>';
  return '<header class="top"><div class="topin">' + lead +
    '<div class="ttl"><h1>' + esc(title) + '</h1>' + (sub ? '<p>' + esc(sub) + '</p>' : '') + '</div></div></header>';
}

function stepper(id, q, dec, inc){
  return '<div class="step"><button data-act="' + dec + '" data-id="' + id + '" aria-label="Remove one">−</button>' +
    '<output aria-live="polite">' + q + '</output>' +
    '<button data-act="' + inc + '" data-id="' + id + '" aria-label="Add one">+</button></div>';
}

function menuView(){
  const cats = ['All','Mains','Snacks','Drinks'];
  const chips = '<div class="chips" role="group" aria-label="Filter menu">' + cats.map(c =>
    '<button class="chip" data-act="filter" data-id="' + c + '" aria-pressed="' + (filter === c) + '">' + c + '</button>').join('') + '</div>';
  const rows = MENU.filter(m => filter === 'All' || m.cat === filter).map(m => {
    const q = cart[m.id] || 0;
    return '<div class="row"><button class="rowmain" data-act="open" data-id="' + m.id + '">' +
      '<span class="tile c-' + m.cat + '">' + art(m.id) + '</span>' +
      '<span class="rinfo"><b>' + esc(m.name) + '</b><span>' + esc(m.desc) + '</span><span class="price">' + money(m.price) + '</span></span></button>' +
      (q ? stepper(m.id, q, 'dec', 'inc') : '<button class="add" data-act="inc" data-id="' + m.id + '" aria-label="Add ' + esc(m.name) + '">Add</button>') + '</div>';
  }).join('');
  return chips + '<div class="list">' + rows + '</div>';
}

  const ids = Object.keys(cart);
  const ub = '<div class="undobar">' +

    '<button class="mini" data-act="redo"' + (redo.size ? '' : ' disabled') + '>↷ Redo' + (redo.size ? ': ' + esc(redo.peek().label) : '') + '</button></div>';
  if (!ids.length){
    return ub + '<div class="panel"><h2>Your cart is empty</h2><p class="muted">Add something from the menu. If you just cleared it, Undo brings it back.</p></div>' +
      '<button class="btn ghost" data-act="tab" data-id="menu">Browse the menu</button>';

    '<div class="panel"><div class="kv"><span>Subtotal</span><span>' + money(subtotal()) + '</span></div>' +
    '<div class="kv"><span>Delivery</span><span>' + (fee() ? money(fee()) : 'Free') + '</span></div>' +
    '<div class="kv total"><span>Total</span><span>' + money(subtotal() + fee()) + '</span></div></div>' +
    (form.err ? '<p class="err" role="alert">' + esc(form.err) + '</p>' : '') +
    '<button class="btn" data-act="place">Place order · ' + money(subtotal() + fee()) + '</button>';
}

function itemsText(o){
  return o.items.map(i => i.qty + ' × ' + byId[i.id].name).join(', ');
}

function doneView(){
  const o = lastOrder;
  return '<div class="panel done"><span class="tag">Order received</span><div class="big-num">' + esc(o.id) + '</div>' +
    '<p><b>' + esc(o.name) + '</b>, your food will be ready in about 15 minutes.</p>' +
    '<p class="muted small">' + esc(o.where) + (o.hostelNote ? ' · ' + esc(o.hostelNote) : '') + '</p></div>' +
    '<div class="panel"><h2>Summary</h2><p class="muted">' + esc(itemsText(o)) + '</p><div class="kv total"><span>Total (' + esc(o.pay) + ')</span><span>' + money(o.total) + '</span></div></div>' +
    '<button class="btn" data-act="tab" data-id="orders">See past orders</button>' +
    '<button class="btn ghost" data-act="tab" data-id="menu">Back to the menu</button>';
}

function ordersView(){
  const list = orders.toArray().reverse();
  if (!list.length) return '<div class="panel"><h2>No orders yet</h2><p class="muted">Orders you place show up here, newest first.</p></div>';
  const top = orders.peek();
  return '<button class="btn" data-act="reorder" data-id="' + esc(top.id) + '">Reorder my latest · ' + esc(top.id) + '</button>' +
    list.map((o,i) =>
      '<div class="panel order"><div class="head"><b>' + esc(o.id) + '</b><span>' +
      (i === 0 ? '<span class="tag">Top of stack</span> ' : '') + (o.example ? '<span class="tag plain">Example</span>' : '') + '</span></div>' +
      '<p>' + esc(itemsText(o)) + '</p>' +
      '<div class="kv small muted"><span>' + esc(o.time) + ' · ' + esc(o.where) + '</span><span>' + money(o.total) + '</span></div>' +
      '<button class="mini" data-act="reorder" data-id="' + esc(o.id) + '" style="align-self:flex-start">Reorder this</button></div>').join('');
}

function tower(arr, labelFn, emptyText){
  if (!arr.length) return '<div class="tower"><div class="cell empty">' + esc(emptyText) + '</div><div class="base"></div></div>';
  const rev = arr.map((x,i) => ({x, pos:i + 1})).reverse();
  const shown = rev.slice(0, 6);
  const hidden = rev.length - shown.length;
  return '<div class="tower">' + shown.map((e,i) =>
    '<div class="cell' + (i === 0 ? ' top-cell' : '') + '"><i>' + e.pos + '</i><span>' + esc(labelFn(e.x)) + '</span>' + (i === 0 ? '<span class="t">TOP</span>' : '') + '</div>').join('') +
    (hidden ? '<div class="cell empty">… ' + hidden + ' more below</div>' : '') + '<div class="base"></div></div>';
}

function stacksView(){
  return '<div class="panel"><p>A stack is last in, first out. You add and remove at one end only, called the top. Everything below shows the three stacks this app is using right now. Add food, open a dish, then come back and watch them change.</p></div>' +
    '<div class="towers">' +
    '<div class="panel"><h2>Screen stack</h2><p class="muted small" style="margin-bottom:10px">Each screen you open is pushed. Back pops the top, so you return to exactly where you were.</p>' +
    tower(nav.toArray(), viewName, 'empty') + '</div>' +
    '<div class="panel"><h2>Undo stack</h2><p class="muted small" style="margin-bottom:10px">Each cart change pushes a snapshot. Undo pops the newest one.</p>' +
    tower(undo.toArray(), c => c.label, 'Nothing to undo yet') + '</div>' +
    '<div class="panel"><h2>Redo stack</h2><p class="muted small" style="margin-bottom:10px">Undo moves a change here. A new cart change empties it.</p>' +
    tower(redo.toArray(), c => c.label, 'Nothing to redo') + '</div>' +
    '<div class="panel"><h2>Order stack</h2><p class="muted small" style="margin-bottom:10px">Placed orders pile up. The latest sits on top, which is why Reorder latest is a peek.</p>' +
    tower(orders.toArray(), o => o.id + ' · ' + money(o.total), 'No orders yet') + '</div></div>' +
    '<div class="panel"><h2>Other places stacks run</h2><ul class="uses">' +
    '<li>Browser history and the Back button</li>' +
    '<li>Undo and redo in editors, spreadsheets and design tools</li>' +
    '<li>The call stack that tracks which function to return to</li>' +
    '<li>Checking matching brackets in code and formulas</li>' +
    '<li>Depth-first search, such as solving mazes and exploring graphs</li></ul></div>';
}

function coverView(){
  const plates = '<svg class="plates" viewBox="0 0 240 118" role="img" aria-label="Three plates stacked on top of each other">' +
    '<rect x="50" y="4" width="140" height="26" rx="13" style="fill:var(--sky)"/>' +
    '<rect x="32" y="34" width="176" height="26" rx="13" style="fill:var(--gold)"/>' +
    '<rect x="14" y="64" width="212" height="26" rx="13" style="fill:var(--accent)"/>' +
    '<rect x="0" y="100" width="240" height="4" rx="2" style="fill:var(--ink)"/>' +
    '<text x="120" y="116" text-anchor="middle" style="font:600 9px var(--font-mono);fill:var(--muted);letter-spacing:.08em">LAST ON, FIRST OFF</text></svg>';
  const strip = '<div class="strip">' + ['jollof','banku','kelewele','sobolo'].map(id =>
    '<span class="tile c-' + byId[id].cat + '">' + art(id) + '</span>').join('') + '</div>';
  return '<section class="cover"><span class="tag" style="align-self:flex-start">Main canteen</span>' +
    '<h1>Campus <span>Chop</span></h1>' +
    '<p class="lede">Order from the lecture hall. Collect it hot at the counter, or have it brought to your hostel.</p>' +
    plates +
    strip +
    '<div class="facts"><div><b>' + MENU.length + '</b><span>dishes today</span></div><div><b>~15 min</b><span>to prepare</span></div><div><b>GH₵ 3</b><span>hostel delivery</span></div></div>' +
    '<button class="btn" data-act="start">Start ordering</button>' +
    '<button class="btn ghost" data-act="tab" data-id="settings">Settings</button>' +
    '<p class="muted small">Screens, cart undo and order history in this app all run on stacks. Open the Stacks tab to watch them work.</p></section>';
}

function chipGroup(label, act, cur, opts){
  return '<div class="field"><span class="legend">' + label + '</span><div class="chips" role="group" aria-label="' + label + '">' +
    opts.map(o => '<button class="chip" data-act="' + act + '" data-id="' + o[0] + '" aria-pressed="' + (cur === o[0]) + '">' + o[1] + '</button>').join('') +
    '</div></div>';
}

function settingsView(){
  const wipe = confirmWipe
    ? '<p class="muted small">This deletes all ' + orders.size + ' saved orders from this device and cannot be undone.</p>' +
      '<div class="warnrow"><button class="mini danger solid" data-act="wipe-yes">Delete orders</button><button class="mini" data-act="wipe-no">Keep them</button></div>'
    : '<button class="mini danger" data-act="wipe"' + (orders.size ? '' : ' disabled') + ' style="align-self:flex-start">Clear order history</button>';
  return '<div class="panel setgroup"><h2>Appearance</h2>' +
    chipGroup('Theme', 'set-theme', settings.theme, [['system','System'],['light','Light'],['dark','Dark']]) +
    chipGroup('Text size', 'set-size', settings.size, [['normal','Normal'],['large','Large']]) + '</div>' +
    '<div class="panel setgroup"><h2>Order details</h2><p class="muted small">Saved on this device and filled in for you at checkout.</p>' +
    '<div class="field"><label for="s-name">Name for orders</label><input type="text" id="s-name" autocomplete="name" value="' + esc(settings.name) + '" data-setting="name"></div>' +
    '<div class="field"><label for="s-phone">Phone number</label><input type="tel" id="s-phone" autocomplete="tel" placeholder="024 000 0000" value="' + esc(settings.phone) + '" data-setting="phone"></div>' +
    chipGroup('Usual pickup', 'set-mode', settings.mode, [['counter','Canteen counter'],['library','Library steps'],['hostel','Hostel delivery']]) +
    chipGroup('Usual payment', 'set-pay', settings.pay, [['momo','MoMo'],['cash','Cash']]) + '</div>' +
    '<div class="panel setgroup"><h2>Welcome</h2>' +
    '<label class="opt"><input type="checkbox" data-setting="cover"' + (settings.cover ? ' checked' : '') + '><span>Show the cover page when the app opens</span></label>' +
    '<button class="mini" data-act="tab" data-id="cover" style="align-self:flex-start">View cover page</button></div>' +
    '<div class="panel setgroup"><h2>Saved data</h2>' + wipe + '</div>';
}

function dockHTML(v){
  if (v === 'cover') return '';
  let h = '';
  if (count() && (v === 'menu' || v.startsWith('item:'))){
    h += '<button class="cartbar" data-act="cart"><span>View cart · ' + count() + (count() === 1 ? ' item' : ' items') + '</span><span>' + money(subtotal()) + '</span></button>';
  }
  const cur = ['orders','stacks','settings','menu'].includes(v) ? v : '';
  h += '<nav class="tabs" aria-label="Sections">' +
    ['menu:Menu', 'orders:Orders (' + orders.size + ')', 'stacks:Stacks', 'settings:Settings'].map(t => {
      const [k,l] = t.split(':');
      return '<button class="tab" data-act="tab" data-id="' + k + '"' + (cur === k ? ' aria-current="page"' : '') + '>' + l + '</button>';
    }).join('') + '</nav>';
  return h;
}

function render(){
  const v = nav.peek();
  let body = '';
  if (v === 'menu') body = menuView();
  else if (v.startsWith('item:')) body = itemView(v.slice(5));
  else if (v === 'cart') body = cartView();
  else if (v === 'checkout') body = checkoutView();
  else if (v === 'done') body = doneView();
  else if (v === 'orders') body = ordersView();
  else if (v === 'stacks') body = stacksView();
  else if (v === 'cover') body = coverView();
  else if (v === 'settings') body = settingsView();
  $app.innerHTML = header(v) + '<main>' + body + '</main>';
  $dock.innerHTML = dockHTML(v);
}

/* ---------- Placing an order ---------- */
function placeOrder(){
  if (!form.name.trim()){ form.err = 'Enter a name so we can call it out at the counter.'; return; }
  if (!/^[0-9 +]{9,15}$/.test(form.phone.trim())){ form.err = 'Enter a phone number with at least 9 digits.'; return; }
  if (form.mode === 'hostel' && !form.hostel.trim()){ form.err = 'Enter your hostel and room so we can find you.'; return; }
  const n = 100 + orders.size + 1;
  const o = {
    id:'CC-' + n, name:form.name.trim(), where:MODES[form.mode].label, pay:form.pay === 'momo' ? 'MoMo' : 'Cash',
    hostelNote:form.mode === 'hostel' ? form.hostel.trim() : '', time:new Date().toLocaleString([], {weekday:'short', hour:'2-digit', minute:'2-digit'}),
    total:subtotal() + fee(), items:Object.entries(cart).map(([id,qty]) => ({id, qty}))
  };
  orders.push(o);
  saveOrders();
  lastOrder = o;
  cart = {};
  undo.clear(); redo.clear();       // an order is final, so there is nothing to undo
  form.err = '';
  nav.clear(); nav.push('menu'); nav.push('done');
  window.scrollTo(0,0);
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'INPUT') return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act){
    case 'back': back(); break;
    case 'tab': tab(id); break;
    case 'filter': filter = id; break;
    case 'open': itemQty = 1; go('item:' + id); break;
    case 'inc': addItem(id, 1); if (nav.peek() === 'menu' && cart[id] === 1) notify('Added ' + byId[id].name, true); break;
    case 'dec': removeOne(id); break;
    case 'qinc': itemQty = Math.min(itemQty + 1, 20); break;
    case 'qdec': itemQty = Math.max(itemQty - 1, 1); break;
    case 'addqty': addItem(id, itemQty); notify('Added ' + itemQty + ' × ' + byId[id].name, true); back(); break;
    case 'cart': go('cart'); break;
    case 'clear': clearCart(); notify('Cart cleared', true); break;
    case 'undo': doUndo(); break;
    case 'redo': doRedo(); break;
    case 'checkout': form.err = ''; go('checkout'); break;
    case 'place': placeOrder(); break;
    case 'start': tab('menu'); break;
    case 'set-theme': settings.theme = id; saveSettings(); applySettings(); break;
    case 'set-size': settings.size = id; saveSettings(); applySettings(); break;
    case 'set-mode': settings.mode = id; form.mode = id; saveSettings(); break;
    case 'set-pay': settings.pay = id; form.pay = id; saveSettings(); break;
    case 'wipe': confirmWipe = true; break;
    case 'wipe-no': confirmWipe = false; break;
    case 'wipe-yes': orders.clear(); saveOrders(); confirmWipe = false; notify('Order history cleared'); break;
    case 'reorder': {
      const o = orders.toArray().find(x => x.id === id);
      if (!o) break;
      mutate('Reordered ' + o.id, () => { cart = {}; o.items.forEach(i => { cart[i.id] = i.qty; }); });
      go('cart');
      break;
    }
  }
  render();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.act === 'mode'){ form.mode = t.value; render(); }
  else if (t.dataset && t.dataset.act === 'pay'){ form.pay = t.value; render(); }
  else if (t.dataset && t.dataset.setting && t.type === 'checkbox'){ settings[t.dataset.setting] = t.checked; saveSettings(); }
});
document.addEventListener('input', e => {
  const f = e.target.dataset && e.target.dataset.field;
  if (f) form[f] = e.target.value;      // no re-render while typing, so focus stays put
  const st = e.target.dataset && e.target.dataset.setting;
  if (st && e.target.type !== 'checkbox'){ settings[st] = e.target.value; if (st in form) form[st] = e.target.value; saveSettings(); }
});

loadOrders();
form.name = settings.name; form.phone = settings.phone; form.mode = settings.mode; form.pay = settings.pay;
applySettings();
if (settings.cover){ nav.clear(); nav.push('cover'); }
render();
</script>
